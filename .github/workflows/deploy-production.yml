name: Deploy production

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      image_tag:
        description: Existing image tag to deploy (skips the Docker build)
        required: false
        type: string

# A production release must never be cancelled halfway through: cancel-in-progress
# is false and the concurrency group is shared by tags and dispatches.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    name: Verify
    uses: ./.github/workflows/verify.yml

  deploy:
    name: Deploy production (OIDC)
    needs: verify
    runs-on: ubuntu-latest
    # The first production create (RDS, ElastiCache, NAT, ACM) can take an hour.
    timeout-minutes: 120
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      OWM_ENVIRONMENT: production
      OWM_STACK_PREFIX: ${{ vars.OWM_STACK_PREFIX || 'OwmProd' }}
      OWM_NAME_PREFIX: ${{ vars.OWM_NAME_PREFIX || 'owm-prod' }}
      IMAGE_TAG: ${{ github.event.inputs.image_tag || github.sha }}
      OWM_DOMAIN_NAME: ${{ vars.OWM_DOMAIN_NAME }}
      OWM_HOSTED_ZONE_ID: ${{ vars.OWM_HOSTED_ZONE_ID }}
      OWM_HOSTED_ZONE_NAME: ${{ vars.OWM_HOSTED_ZONE_NAME }}
      OWM_SES_IDENTITY: ${{ vars.OWM_SES_IDENTITY }}
      OWM_EMAIL_FROM: ${{ vars.OWM_EMAIL_FROM }}
      OWM_ALARM_EMAIL: ${{ vars.OWM_ALARM_EMAIL }}
      OWM_MONTHLY_BUDGET_USD: ${{ vars.OWM_MONTHLY_BUDGET_USD }}
      OWM_MONTHLY_SPEND_CAP_USD: ${{ vars.OWM_MONTHLY_SPEND_CAP_USD }}
      OWM_SIGNIN_ALLOWED_EMAILS: ${{ vars.OWM_SIGNIN_ALLOWED_EMAILS }}
      OWM_SES_PRODUCTION_ACCESS: ${{ vars.OWM_SES_PRODUCTION_ACCESS || 'false' }}
      OWM_SENTRY_DSN: ${{ secrets.OWM_SENTRY_DSN }}
      # Invite-only launch. It is a build argument, so flipping it needs a new
      # image and a release.
      OWM_ALLOW_SEARCH_INDEXING: 'false'
      # Optional sizing/count overrides; unset keeps the production profile.
      OWM_WEB_DESIRED_COUNT: ${{ vars.OWM_WEB_DESIRED_COUNT }}
      OWM_MIN_WEB_TASKS: ${{ vars.OWM_MIN_WEB_TASKS }}
      OWM_MAX_WEB_TASKS: ${{ vars.OWM_MAX_WEB_TASKS }}
      OWM_WORKER_DESIRED_COUNT: ${{ vars.OWM_WORKER_DESIRED_COUNT }}
      OWM_MIN_WORKER_TASKS: ${{ vars.OWM_MIN_WORKER_TASKS }}
      OWM_MAX_WORKER_TASKS: ${{ vars.OWM_MAX_WORKER_TASKS }}
      OWM_WEB_CPU: ${{ vars.OWM_WEB_CPU }}
      OWM_WEB_MEMORY: ${{ vars.OWM_WEB_MEMORY }}
      OWM_WORKER_CPU: ${{ vars.OWM_WORKER_CPU }}
      OWM_WORKER_MEMORY: ${{ vars.OWM_WORKER_MEMORY }}
      OWM_DB_INSTANCE_CLASS: ${{ vars.OWM_DB_INSTANCE_CLASS }}
      OWM_DB_INSTANCE_SIZE: ${{ vars.OWM_DB_INSTANCE_SIZE }}
      OWM_DB_ALLOCATED_STORAGE: ${{ vars.OWM_DB_ALLOCATED_STORAGE }}
      OWM_DB_MAX_ALLOCATED_STORAGE: ${{ vars.OWM_DB_MAX_ALLOCATED_STORAGE }}
      OWM_DB_BACKUP_RETENTION_DAYS: ${{ vars.OWM_DB_BACKUP_RETENTION_DAYS }}
      OWM_CACHE_NODE_TYPE: ${{ vars.OWM_CACHE_NODE_TYPE }}
      OWM_NAT_GATEWAYS: ${{ vars.OWM_NAT_GATEWAYS }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The tag guard needs the commit graph, not a shallow clone.
          fetch-depth: 0

      - name: Require the OIDC deploy role
        run: |
          if [ -z "$AWS_DEPLOY_ROLE_ARN" ] || [ -z "$OWM_DOMAIN_NAME" ]; then
            echo "Set AWS_DEPLOY_ROLE_ARN and OWM_DOMAIN_NAME in the production environment." >&2
            exit 1
          fi

      # Only a commit that has passed through main may reach production. A tag
      # on a side branch is rejected even if it points at a plausible commit.
      - name: Guard the tag against main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Commit $GITHUB_SHA is not an ancestor of origin/main; refusing to deploy."
            exit 1
          fi

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: owm-prod-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # The images are linux/arm64 (Fargate Graviton); an amd64 runner needs
      # QEMU and Buildx to build them.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - run: pnpm install --frozen-lockfile

      - name: Deploy production
        env:
          # A dispatch with an explicit tag is the hotfix/redeploy path.
          DISPATCH_IMAGE_TAG: ${{ github.event.inputs.image_tag }}
        run: |
          if [ -n "$DISPATCH_IMAGE_TAG" ]; then
            export SKIP_BUILD=1
          fi
          pnpm deploy:prod
