name: CI

on:
  pull_request:
    # Tracker and documentation commits do not change the image. Keep this
    # narrow: test_md/ feeds tests and public sample .md files ship in the app.
    paths-ignore: &paths-ignore
      - '.scratch/**'
      - 'docs/**'
      - '*.md'
      - '**/AGENTS.md'
  push:
    branches: [main]
    paths-ignore: *paths-ignore
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    uses: ./.github/workflows/verify.yml

  deploy:
    name: Deploy staging (OIDC)
    needs: verify
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: staging
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      IMAGE_TAG: ${{ github.sha }}
      OWM_DOMAIN_NAME: ${{ vars.OWM_DOMAIN_NAME }}
      OWM_HOSTED_ZONE_ID: ${{ vars.OWM_HOSTED_ZONE_ID }}
      OWM_HOSTED_ZONE_NAME: ${{ vars.OWM_HOSTED_ZONE_NAME }}
      OWM_SES_IDENTITY: ${{ vars.OWM_SES_IDENTITY }}
      OWM_EMAIL_FROM: ${{ vars.OWM_EMAIL_FROM }}
      OWM_ALARM_EMAIL: ${{ vars.OWM_ALARM_EMAIL }}
      OWM_MONTHLY_BUDGET_USD: ${{ vars.OWM_MONTHLY_BUDGET_USD }}
      OWM_MONTHLY_SPEND_CAP_USD: ${{ vars.OWM_MONTHLY_SPEND_CAP_USD }}
      OWM_SIGNIN_ALLOWED_EMAILS: ${{ vars.OWM_SIGNIN_ALLOWED_EMAILS }}
      OWM_SENTRY_DSN: ${{ secrets.OWM_SENTRY_DSN }}
      OWM_STACK_PREFIX: ${{ vars.OWM_STACK_PREFIX }}
      OWM_NAME_PREFIX: ${{ vars.OWM_NAME_PREFIX }}
    steps:
      - uses: actions/checkout@v4
      - name: Require the OIDC deploy role
        run: |
          if [ -z "$AWS_DEPLOY_ROLE_ARN" ] || [ -z "$OWM_DOMAIN_NAME" ]; then
            echo "Set AWS_DEPLOY_ROLE_ARN and OWM_DOMAIN_NAME in the staging environment." >&2
            exit 1
          fi
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: owm-staging-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # The images are linux/arm64 (Fargate Graviton); an amd64 runner needs
      # QEMU and Buildx to build them.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - run: pnpm install --frozen-lockfile
      # deploy.sh runs the migration task before rolling either service; see
      # docs/DEPLOYMENT.md §7 for the rollback path.
      - run: pnpm deploy:staging
